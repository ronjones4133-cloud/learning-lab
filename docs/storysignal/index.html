function statusFrom(s,source){s=String(s||'').toLowerCase();if(/did.not.finish|\bdnf\b|abandon/.test(s))return'dnf';if(/to.read|want.to.read|wishlist/.test(s))return'to-read';if(/currently.read|in.progress|listening|reading-now/.test(s))return'listening';if(/finished|completed|\bread\b|finished-reading/.test(s))return'finished';return source==='goodreads'?'to-read':'owned'}
function parseCSV(text){let lines=[],row=[],cell='',quote=false;const sample=text.slice(0,1500);const sep=sample.split('\n')[0].includes('\t')?'\t':(sample.split('\n')[0].split(';').length>sample.split('\n')[0].split(',').length?';':',');for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quote&&text[i+1]==='"'){cell+='"';i++}else quote=!quote}else if(c===sep&&!quote){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quote){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))lines.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(x=>x.trim()))lines.push(row);return lines}
function parseImport(text,name,source){let items=[];if(name.toLowerCase().endsWith('.json')){const obj=JSON.parse(text);if(obj.storySignalBackup&&obj.profile){return{backup:obj.profile,items:[]}}const a=Array.isArray(obj)?obj:(Array.isArray(obj.books)?obj.books:Array.isArray(obj.items)?obj.items:[]);items=a.map(x=>typeof x==='string'?{title:x}:({title:x.title||x.Title||x.name||x.product_title||x.productName,author:x.author||x.Author||x.authors||'',status:x.status||x.Status||x.shelf||'',format:x.format||'',rating:x.rating||x['My Rating']}));}

async function queryGoogleBooks(q,latest=false){q=q.trim();if(!q)return toast('Enter a topic or title first.');searchTerm=q;queryRecently=latest;searching=true;discoverError='';route('discover');const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),10000);try{let query='https://www.googleapis.com/books/v1/volumes?q='+encodeURIComponent(q)+'&maxResults=16&printType=books&orderBy='+(latest?'newest':'relevance');const r=await fetch(query,{signal:controller.signal});if(!r.ok)throw Error('Service returned '+r.status);let data=await r.json();let list=(data.items||[]).map(x=>{const v=x.volumeInfo||{};return{title:v.title||'',author:(v.authors||[]).join(', '),year:(v.publishedDate||'').slice(0,4),description:(v.description||'').replace(/<[^>]*>/g,'').slice(0,300),link:v.infoLink||''}}).filter(x=>x.title);discovery=list;discoverError=list.length?'':'No books found. Try a broader search term.';}catch(e){discovery=[];discoverError='Live book discovery is unavailable right now. Your offline recommendations and book library still work.'}finally{clearTimeout(timer);searching=false;route('discover')}}

if(act==='refresh'){route('home');return toast('Matches refreshed with your latest taste profile.')}
if(act==='addBook'){let title=$('manualTitle')?.value,author=$('manualAuthor')?.value,status=$('manualStatus')?.value,format=$('manualFormat')?.value;if(!title?.trim())return toast('Enter a book title.');let ok=ensureBook(title,author,'Manual',status,format);save();render();return toast(ok?'Book added.':'That book is already in your library.')}
if(act==='sampleCSV'){const data='Title,Author,Status,Format\nThe Wager,David Grann,Finished,Audiobook\nThe Goal,Eliyahu Goldratt,To Read,Kindle';let blob=new Blob([data],{type:'text/csv'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='StorySignal-import-example.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1200);return}
if(act==='search')return queryGoogleBooks($('searchBooks')?.value||'');if(act==='newest')return queryGoogleBooks($('searchBooks')?.value||'',true);
if(act==='backup')return doBackup();if(act==='restore')return $('restoreFile')?.click();
if(act==='switch'){U=null;current='';save();route('home');return}
if(act==='deleteProfile'){if(!confirm('Delete this local profile and all its feedback? Export a backup first if you want to keep it.'))return;delete profiles[U.name.toLowerCase()];U=null;current='';save();route('home');return toast('Local profile deleted.')}
if(act==='closeReview')return route('home');}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
if(t.dataset.view)return route(t.dataset.view);
if(t.dataset.surpriseMode){const st=getSurprise();st.mode=t.dataset.surpriseMode;st.current='';nextSurprise();return route('surprise');}
if(t.dataset.surpriseAction)return surpriseOutcome(t.dataset.surpriseAction);
if(t.dataset.surpriseReject)return surpriseOutcome('skip',t.dataset.surpriseReject);
if(t.id==='switchProfile')return eventButton({dataset:{act:'switch'}});
if(t.dataset.switch){current=t.dataset.switch;U=profiles[current];save();return route('home')}
if(t.dataset.format){U.format=t.dataset.format;save();return render()}
if(t.dataset.toggle){U.context=currentMomentValue().slice(0,550);const k=t.dataset.toggle;U[k]=toggle(U[k],t.dataset.key);save();return render()}
if(t.dataset.act)return eventButton(t);
if(t.dataset.query)return queryGoogleBooks(t.dataset.query,true);
if(t.dataset.status)return recordStatus(t.dataset.status,t.dataset.setstatus);
if(t.dataset.remove){if(!confirm('Remove '+t.dataset.remove+' from your library?'))return;U.library=U.library.filter(b=>key(b.title)!==key(t.dataset.remove));save();return render()}
if(t.dataset.review)return askFeedback(t.dataset.review);
if(t.dataset.verdict){window.feedbackDraft.verdict=t.dataset.verdict;document.querySelectorAll('[data-verdict]').forEach(b=>b.classList.toggle('on',b.dataset.verdict===t.dataset.verdict));return}
if(t.dataset.reason){window.feedbackDraft.reason=t.dataset.reason===window.feedbackDraft.reason?'':t.dataset.reason;document.querySelectorAll('[data-reason]').forEach(b=>b.classList.toggle('on',b.dataset.reason===window.feedbackDraft.reason));return}
if(t.dataset.savefeedback){let f=window.feedbackDraft;if(!f?.verdict)return toast('Choose how the book went.');U.feedback[key(f.title)]={title:f.title,verdict:f.verdict,reason:f.reason,date:new Date().toISOString()};if(!libraryItem(f.title))ensureBook(f.title,canon(f.title)?.a,'Manual','finished',U.format==='ebook'?'ebook':'audio');save();route('home');return toast('Feedback saved. Your future matches will adapt.')}
if(t.dataset.livetitle){let ok=ensureBook(t.dataset.livetitle,t.dataset.liveauthor,'Google Books','to-read',U.format==='ebook'?'ebook':'audio');save();render();return toast(ok?'Book added to your radar.':'Already tracked.')}
});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.libraryStatus)return recordStatus(t.dataset.libraryStatus,t.value);
if(t.id==='importFile')return importFile(t.files?.[0],$('importType')?.value||'auto');
if(t.id==='restoreFile'&&t.files?.[0]){t.files[0].text().then(s=>{let j=JSON.parse(s);if(!j.storySignalBackup||!j.profile?.name||!Array.isArray(j.profile.library))throw Error('Not a StorySignal backup');if(!confirm('Restore '+j.profile.name+'? An existing local profile with the same name will be replaced.'))return;U=j.profile;save();route('home');toast('Profile restored.')}).catch(()=>toast('Could not restore the selected backup.'))}}
);
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target?.id==='newName')eventButton({dataset:{act:'create'}});if(e.key==='Enter'&&e.target?.id==='searchBooks')eventButton({dataset:{act:'search'}})});
if(U&&!U.onboarded)step=0;render();
</script>
</body>
</html>
